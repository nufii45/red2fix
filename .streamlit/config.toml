# Everything stays on this machine: localhost only, no telemetry, fonts served from dashboard/static.
[server]
address = "localhost"
# Skips the first-run email prompt, which hangs a non-interactive shell; open the URL yourself.
headless = true
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
# Hides the theme picker, so the app follows the OS theme like the custom CSS in dashboard/style.css does.
toolbarMode = "minimal"

# bryl-minimal: monochrome, no accent colour, type does the talking.
[theme]
font = "Geist, system-ui, sans-serif"
codeFont = "Geist Mono, ui-monospace, monospace"
# The pixel font is applied only to titles and stat values, in style.css.
headingFont = "Geist, system-ui, sans-serif"
baseFontSize = 15
codeFontSize = "13px"
baseRadius = "12px"
buttonRadius = "6px"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = true

[[theme.fontFaces]]
family = "Geist"
url = "app/static/fonts/Geist-Variable.woff2"
weight = "100 900"

[[theme.fontFaces]]
family = "Geist Mono"
url = "app/static/fonts/GeistMono-Variable.woff2"
weight = "100 900"

[[theme.fontFaces]]
family = "Geist Pixel"
url = "app/static/fonts/GeistPixel-Square.woff2"

[theme.light]
primaryColor = "#0a0a0a"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#fafafa"
textColor = "#0a0a0a"
linkColor = "#0a0a0a"
borderColor = "#e9e9e9"
dataframeBorderColor = "#e9e9e9"
dataframeHeaderBackgroundColor = "#fafafa"
codeBackgroundColor = "#fafafa"
codeTextColor = "#0a0a0a"
# Charts sort series alphabetically: nano / super / ultra land lightest to darkest.
chartCategoricalColors = ["#d4d4d4", "#737373", "#0a0a0a", "#a3a3a3", "#404040", "#e9e9e9", "#262626"]
chartSequentialColors = ["#fafafa", "#f5f5f5", "#e9e9e9", "#d4d4d4", "#a3a3a3", "#737373", "#525252", "#404040", "#262626", "#0a0a0a"]

[theme.light.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#fafafa"
borderColor = "#e9e9e9"

[theme.dark]
primaryColor = "#f4f4f5"
backgroundColor = "#0c0c0f"
secondaryBackgroundColor = "#18181b"
textColor = "#f4f4f5"
linkColor = "#f4f4f5"
borderColor = "#2a2a30"
dataframeBorderColor = "#2a2a30"
dataframeHeaderBackgroundColor = "#18181b"
codeBackgroundColor = "#18181b"
codeTextColor = "#f4f4f5"
chartCategoricalColors = ["#3a3a42", "#a0a0a8", "#f4f4f5", "#8a8a92", "#d4d4d8", "#2a2a30", "#e4e4e7"]
chartSequentialColors = ["#18181b", "#1e1e22", "#2a2a30", "#3a3a42", "#8a8a92", "#a0a0a8", "#c4c4cc", "#d4d4d8", "#e4e4e7", "#f4f4f5"]

[theme.dark.sidebar]
backgroundColor = "#0c0c0f"
secondaryBackgroundColor = "#18181b"
borderColor = "#2a2a30"
